# CI for muxleq: format and lint, the pre-commit gate, ASan/UBSan, and the deep
# validation suite, split into independent jobs that run in parallel.
#
#   format   : clang-format 20 and a trailing-newline check (no toolchain)
#   check    : make check, then publish the generated RV32I binaries
#   sanitize : make sanitize (ASan/UBSan over the interpreter and emitters)
#   deep     : conformance, the Z3 proof, rvopt fuzz, the rv32ui suite, DureMark
#
# check, sanitize, and deep install the xPack riscv-none-elf toolchain (cached)
# and build the RV32I programs from source. Together with check they reproduce
# make check-all. No job depends on another, so all four run concurrently.
name: ci

on:
  push:
  pull_request:

# Supersede in-flight runs of the same ref instead of piling them up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

env:
  # Single source of truth for the xPack toolchain: shared by the installer and
  # the cache key so a bump invalidates the cache automatically.
  XPACK_RISCV_VERSION: 15.2.0-1

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-20
      - name: Check trailing newline
        run: .ci/check-newline.sh
      - name: Check clang-format
        env:
          CLANG_FORMAT: clang-format-20
        run: .ci/check-format.sh

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gforth
      - name: Cache RISC-V toolchain
        uses: actions/cache@v6
        with:
          path: ~/riscv-none-elf-gcc
          key: xpack-riscv-none-elf-gcc-${{ env.XPACK_RISCV_VERSION }}-linux-x64
      - name: Install RISC-V toolchain
        run: .ci/install-riscv-toolchain.sh
      - name: Run pre-commit gate
        run: make check
      - name: Publish RV32I test binaries
        uses: actions/upload-artifact@v7
        with:
          name: rv32i-binaries
          retention-days: 7
          if-no-files-found: error
          path: |
            build/rv32i/*.elf
            build/rv32i/*.bin

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gforth
      - name: Cache RISC-V toolchain
        uses: actions/cache@v6
        with:
          path: ~/riscv-none-elf-gcc
          key: xpack-riscv-none-elf-gcc-${{ env.XPACK_RISCV_VERSION }}-linux-x64
      - name: Install RISC-V toolchain
        run: .ci/install-riscv-toolchain.sh
      - name: ASan and UBSan validation
        run: make sanitize

  deep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gforth python3-z3
      - name: Cache RISC-V toolchain
        uses: actions/cache@v6
        with:
          path: ~/riscv-none-elf-gcc
          key: xpack-riscv-none-elf-gcc-${{ env.XPACK_RISCV_VERSION }}-linux-x64
      - name: Install RISC-V toolchain
        run: .ci/install-riscv-toolchain.sh
      - name: Conformance, proofs, fuzz, and benchmarks
        run: |
          make verify-rv32i verify-microcode verify-rvopt-mux verify-mux32 \
               verify-duremark-rvopt verify-loader-rejects verify-riscv-tests duremark
