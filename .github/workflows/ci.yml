# CI for muxleq: format and lint, the pre-commit gate, ASan/UBSan, and the deep
# validation suite, split into independent jobs that run in parallel.
#
#   format   : clang-format 20 and a trailing-newline check (no toolchain)
#   check    : make check
#   sanitize : make sanitize (ASan/UBSan over the interpreter and emitters)
#   deep     : wide native-image validation, multi-seed rvopt differential
#              fuzz (make fuzz-rvopt), and loader rejection
#   rv32i    : cross-build the tests/rv32i programs with the xPack RISC-V
#              toolchain, run them + the rv32ui conformance suite through
#              rvopt+muxleq, upload the binaries as an artifact, and (on the
#              default branch) publish them as a rolling pre-release
#
# check, sanitize, and deep cover the local check-all gate. No job depends on
# another, so all five run concurrently.
name: ci

on:
  push:
  pull_request:

# Supersede in-flight runs of the same ref instead of piling them up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install formatters
        # Versions are pinned so CI and local runs format identically: clang-format
        # output drifts between majors, and black/shfmt style shifts between
        # releases too (the committed sources are formatted to exactly these).
        # python3 (for scripts/forth-indent.py) is preinstalled on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-20
          pipx install "black==26.5.1"
          # Pinned by content hash, not just the version tag: a re-published
          # release asset would otherwise run unverified in CI.
          shfmt_sha=fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64 \
            -o /tmp/shfmt
          echo "$shfmt_sha  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
      - name: Check trailing newline
        run: .ci/check-newline.sh
      - name: Check formatting (C, Python, shell, Forth)
        env:
          CLANG_FORMAT: clang-format-20
        run: .ci/check-format.sh

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gforth
      - name: Run pre-commit gate
        run: make check

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gforth
      - name: ASan and UBSan validation
        run: make sanitize

  deep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gforth
      - name: Wide native-image validation
        run: |
          make verify-mux verify-loader-rejects
          make fuzz-rvopt

  rv32i:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The other jobs keep the workflow-default contents:read. This one alone
    # publishes a release, so it needs contents:write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gforth
      # The ~150 MB toolchain is cached across runs; the install script skips the
      # download when the cache already holds the pinned version (which lives in
      # the script). Keying on the script's hash busts the cache on a version
      # bump and nowhere else; the version/sha are single-sourced there.
      # Trust boundary: on a cache hit the restored toolchain runs without
      # re-checking its sha (the script verifies only a fresh download). Sound
      # here because Actions caches are branch-scoped, so writing this key needs
      # repo write access, which could tamper with the workflow anyway.
      - name: Cache xPack RISC-V toolchain
        uses: actions/cache@v4
        with:
          path: ~/riscv-none-elf-gcc
          key: xpack-riscv-none-elf-gcc-${{ hashFiles('.ci/install-riscv-toolchain.sh') }}
      - name: Install xPack RISC-V toolchain
        run: .ci/install-riscv-toolchain.sh
      - name: Build and run the RV32I programs and rv32ui conformance
        run: make rv32i-check
      # Per-run copy for PR/branch runs (expires, needs login to fetch).
      - name: Upload built RV32I binaries
        uses: actions/upload-artifact@v4
        with:
          name: rv32i-binaries
          path: build/rv32i
          if-no-files-found: error
      # On the default branch, publish the binaries as a single rolling
      # pre-release anyone can download without logging in. The tag is deleted
      # and recreated each push, so only the newest build's assets exist; no
      # stale files accumulate.
      - name: Package RV32I binaries
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          tar -czf rv32i-binaries.tar.gz -C build rv32i
          sha256sum rv32i-binaries.tar.gz > rv32i-binaries.tar.gz.sha256
      - name: Publish rolling pre-release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=rv32i-latest
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" --prerelease \
            --title "RV32I prebuilt binaries (latest)" \
            --notes "Prebuilt RV32I test binaries lowered from ${GITHUB_SHA}. Rolling pre-release: replaced on every push to the default branch." \
            rv32i-binaries.tar.gz rv32i-binaries.tar.gz.sha256
