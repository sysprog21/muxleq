# CI for muxleq: format and lint, the pre-commit gate, ASan/UBSan, and the deep
# validation suite, split into independent jobs that run in parallel.
#
#   format   : clang-format 20 and a trailing-newline check (no toolchain)
#   check    : make check, including RV32I coverage; with no cross toolchain
#              installed (as here) it fetches the prebuilt .elf inputs from the
#              rv32i-latest pre-release and runs them through rvopt+muxleq
#   sanitize : make check-sanitize (ASan/UBSan over the interpreter and emitters)
#   deep     : wide native-image validation, multi-seed rvopt differential
#              fuzz (make check-fuzz-rvopt), loader rejection, the offline
#              prebuilt-script contract test, and static analysis
#   rv32i    : cross-build the tests/rv32i programs with the xPack RISC-V
#              toolchain, run them + the rv32ui conformance suite through
#              rvopt+muxleq, time the benchmarks (make bench), upload the
#              binaries as an artifact, and (on the default branch, only when
#              tests/rv32i changed) publish them as a rolling pre-release. The
#              published tarball includes the rv32ui .elf inputs, so the
#              toolchain-less "check" job above can run the full suite too.
#
# check, sanitize, and deep cover the local check-all gate. check-analyze's two
# version-sensitive tools are handled explicitly rather than left to whatever a
# runner image ships, since unpinned shellcheck once failed this build on a
# finding no contributor could reproduce: shellcheck is pinned by version and
# hash in the deep job, and cppcheck is turned off there by passing CPPCHECK=,
# so an image that starts shipping it cannot silently begin gating the build.
# clang --analyze runs against the clang the setup action installs. No job
# depends on another, so all five run concurrently.
name: ci

on:
  push:
  pull_request:

# Supersede in-flight runs instead of piling them up, and collapse the duplicate
# that every branch with an open PR would otherwise produce: a push fires the
# push event AND the pull_request event, so keying on github.ref would give
# refs/heads/<branch> and refs/pull/N/merge, two different groups, and both runs
# would go to completion. head_ref (the PR's source branch) and ref_name (the
# pushed branch) are the same string for that pair, so they share a group and the
# later run cancels the earlier. Every push still gets CI, including on branches
# with no PR, which is what keeps the RV32I validation and the binaries artifact
# from going missing on such branches.
#
# The head repository is part of the key because a branch name alone is not
# unique across the world: two forks both offering "patch-1", or a fork whose
# branch is called "main", would otherwise share a group with each other or with
# this repo's own main and cancel runs that have nothing to do with each other.
# Residual and accepted: a tag and a branch with the same short name still
# collide, which needs someone to push both at once to matter.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name
    || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install formatters
        # Versions are pinned so CI and local runs format identically: clang-format
        # output drifts between majors, and black/shfmt style shifts between
        # releases too (the committed sources are formatted to exactly these).
        # python3 (for scripts/forth-indent.py) is preinstalled on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-20
          pipx install "black==26.5.1"
          # Pinned by content hash, not just the version tag: a re-published
          # release asset would otherwise run unverified in CI.
          shfmt_sha=fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64 \
            -o /tmp/shfmt
          echo "$shfmt_sha  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
      - name: Check trailing newline
        run: .ci/check-newline.sh
      - name: Check formatting (C, Python, shell, Forth)
        env:
          CLANG_FORMAT: clang-format-20
        run: .ci/check-format.sh

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-build
      # No cross toolchain here, so make check's RV32I step fetches the prebuilt
      # release. Point it at THIS repo so a fork tests its own artifacts (and
      # cleanly skips if it has none) instead of pulling upstream's.
      - name: Run pre-commit gate
        env:
          REPO: ${{ github.repository }}
        run: make check

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-build
      - name: ASan and UBSan validation
        run: make check-sanitize

  deep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-build
      - name: Install pinned shellcheck
        # check-analyze runs shellcheck, whose findings drift between releases
        # exactly as clang-format's output does: the runner image ships an older
        # one that reports an SC2015 that 0.11.0 does not. Pinning it to the
        # version contributors get from a current distro or brew is what makes a
        # local "make check-analyze" predict this job. Hashed like the format
        # job's shfmt, so a re-published asset cannot change what CI runs.
        run: |
          sc_sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "$sc_sha  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Wide native-image validation
        # REPO points the prebuilt-script live smoke at this repo's own release,
        # so a fork tests its own artifacts (or skips) rather than upstream's.
        env:
          REPO: ${{ github.repository }}
        run: |
          make check-mux check-loader-rejects check-prebuilt
          make check-fuzz-rvopt
          make CPPCHECK= check-analyze

  rv32i:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The other jobs keep the workflow-default contents:read. This one alone
    # publishes a release, so it needs contents:write.
    permissions:
      contents: write
    steps:
      # Full history so the publish gate below can diff this push's range
      # (before..sha) to see whether tests/rv32i changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/setup-build
        with:
          gnu-time: 'true'
      # The ~150 MB toolchain is cached across runs; the install script skips the
      # download when the cache already holds the pinned version (which lives in
      # the script). Keying on the script's hash busts the cache on a version
      # bump and nowhere else; the version/sha are single-sourced there.
      # Trust boundary: on a cache hit the restored toolchain runs without
      # re-checking its sha (the script verifies only a fresh download). Sound
      # here because Actions caches are branch-scoped, so writing this key needs
      # repo write access, which could tamper with the workflow anyway.
      - name: Cache xPack RISC-V toolchain
        uses: actions/cache@v6
        with:
          path: ~/riscv-none-elf-gcc
          key: xpack-riscv-none-elf-gcc-${{ hashFiles('.ci/install-riscv-toolchain.sh') }}
      - name: Install xPack RISC-V toolchain
        run: .ci/install-riscv-toolchain.sh
      - name: Build and run the RV32I programs, then stage the release
        run: make rv32i-release
      # This job is the only one with the RISC-V toolchain, so it is the only
      # place the RTOS checks actually build and run (they skip elsewhere).
      - name: Run the RV32I RTOS checks
        run: make check-rtos
      # Timing-only, informational: the eForth kernels and the rvopt-lowered
      # DureMark. This job is the only one with the cross toolchain, so it is the
      # only place bench-rv32i actually builds and runs (it skips elsewhere). The
      # bench targets still fail the job on a non-zero VM exit, so a crash is
      # caught here, not just slowness.
      - name: Run benchmarks
        run: make bench
      # This job is the only one with a staged release tree, so it is the only
      # place the prebuilt contract test's pass/demos/truncated-release
      # assertions can run (the deep job exercises only the skip/refuse paths).
      # REPO points the live smoke at this repo's own release.
      - name: Contract-test the prebuilt-release script
        env:
          REPO: ${{ github.repository }}
        run: make check-prebuilt
      # Per-run copy for PR/branch runs (expires, needs login to fetch).
      - name: Upload built RV32I binaries
        uses: actions/upload-artifact@v7
        with:
          name: rv32i-binaries
          path: build/rv32i
          if-no-files-found: error
      # The prebuilt release exists only to carry the RV32I .elf inputs to
      # machines without the cross toolchain, so a push that touched only
      # rvopt/muxleq need not republish. The tests/rv32i path filter is the cheap
      # first answer; the manifest comparison below is the authoritative one,
      # since a staging change or a toolchain bump alters the payload without
      # touching tests/rv32i.
      - name: Decide whether the prebuilt release needs updating
        id: pub
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          publish=false
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "no usable baseline commit -- publishing"; publish=true
          elif ! git diff --quiet "$BEFORE" "$AFTER" -- tests/rv32i/; then
            echo "tests/rv32i changed -- publishing"; publish=true
          else
            # Content self-heal: compare the CURRENT release's manifest against
            # the one this build just staged, and republish unless they are the
            # same bytes. An elf can change without changing how many there are,
            # so a count cannot show a release is current; the manifest can.
            # Every step below that cannot produce a manifest to compare --
            # missing release, drifted outer checksum, unreadable or unexpected
            # archive, payload that no longer matches its own manifest -- also
            # publishes, so a broken release heals rather than persists. Use a
            # fresh RUNNER_TEMP path since gh release download -O refuses to
            # clobber.
            cur="$RUNNER_TEMP/rv32i-cur-release.tgz"
            old="$RUNNER_TEMP/rv32i-cur-release"
            rm -rf "$cur" "$cur.sha" "$old"
            mkdir -p "$old"
            fresh=build/rv32i-release/rv32i/MANIFEST.sha256
            if ! gh release download rv32i-latest -p rv32i-binaries.tar.gz -O "$cur" 2>/dev/null; then
              echo "no release tarball -- publishing to self-heal"; publish=true
            elif ! gh release download rv32i-latest -p rv32i-binaries.tar.gz.sha256 -O "$cur.sha" 2>/dev/null \
              || [ "$(awk '{ print $1 }' "$cur.sha")" != "$(sha256sum "$cur" | awk '{ print $1 }')" ]; then
              echo "release checksum missing or drifted -- publishing to self-heal"; publish=true
            elif ! tar -tzf "$cur" >"$cur.list" 2>/dev/null || grep -qvE '^rv32i/' "$cur.list"; then
              echo "release unreadable or has unexpected members -- publishing to self-heal"; publish=true
            elif ! tar -xzf "$cur" -C "$old" 2>/dev/null; then
              echo "release cannot be extracted -- publishing to self-heal"; publish=true
            elif ! scripts/rv32i-manifest.sh verify "$old/rv32i" 2>/dev/null; then
              echo "release payload does not match its own manifest -- publishing to self-heal"; publish=true
            elif ! cmp -s "$old/rv32i/MANIFEST.sha256" "$fresh"; then
              echo "release payload differs from this build -- publishing"; publish=true
            else
              echo "release payload matches this build -- skipping publish"
            fi
          fi
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
      # A single rolling pre-release anyone can download without logging in. The
      # tag is deleted and recreated, so only the newest build's assets exist; no
      # stale files accumulate.
      - name: Package RV32I binaries
        if: steps.pub.outputs.publish == 'true'
        run: |
          tar -czf rv32i-binaries.tar.gz -C build/rv32i-release rv32i
          sha256sum rv32i-binaries.tar.gz > rv32i-binaries.tar.gz.sha256
      - name: Publish rolling pre-release
        if: steps.pub.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=rv32i-latest
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" --prerelease \
            --title "RV32I prebuilt binaries (latest)" \
            --notes "Prebuilt RV32I test binaries built from ${GITHUB_SHA}. Rolling pre-release: replaced when the staged payload changes on the default branch. rv32i/MANIFEST.sha256 lists every archive member with its SHA-256; scripts/rv32i-manifest.sh verify checks an extracted tree against it." \
            rv32i-binaries.tar.gz rv32i-binaries.tar.gz.sha256
